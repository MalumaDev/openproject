name: Dangerfile

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "docs/**"
      - "help/**"
      - "packaging/**"
      - ".pkgr.yml"
      - "extensions/blocknote-extensions/**"
      - "extensions/op-blocknote-hocuspocus/**"

jobs:
  danger:
    if: github.repository_owner == 'opf'
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      DANGER_GEM_VERSION: 9.6.1
      GIT_GEM_VERSION: 5.7.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Setup danger
        run: |
          gem install git -v "${GIT_GEM_VERSION}"
          gem install danger -v "${DANGER_GEM_VERSION}" --conservative
      - name: Run inconsistent translations check
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          danger --verbose
